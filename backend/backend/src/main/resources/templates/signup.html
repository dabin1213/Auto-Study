<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Auto Study 회원가입</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="login-body"> <div class="login-wrapper">
        <div style="text-align: center;">
            <h2>Auto study</h2>
            <p>AI 기반 스마트 학습플랫폼</p>
        </div>
        <div class="signup-box">
            <h3>회원가입</h3>
            <form id="signupForm">
                <label>이름</label>
                <input type="text" id="nickname" placeholder="홍길동" required>
                
                <label>이메일 주소</label>
                <input type="email" id="email" placeholder="example@email.com" required>
                
                <label>비밀번호</label>
                <input type="password" id="password" placeholder="8자 이상 입력" required>
                
                <label>비밀번호 확인</label>
                <input type="password" id="confirmPassword" placeholder="비밀번호 재입력" required>
                
                <div style="display: flex; align-items: center; gap: 10px; margin: 15px 0;">
                    <input type="checkbox" id="agree" required style="width: auto; margin: 0;">
                    <label for="agree" style="margin: 0; font-weight: normal; font-size: 0.85rem;">
                        이용약관 및 개인정보처리방침에 동의합니다.
                    </label>
                </div>
                
                <button type="button" class="login-btn" onclick="signupRequest()">가입하기</button>
            </form>
            <button class="google-btn" onclick="googleSignup()">Google 계정으로 가입</button>
            <div class="signup-link" style="text-align: center; margin-top: 20px;">
                이미 계정이 있으신가요? <a href="/login">로그인</a>
            </div>
        </div>
    </div>

    <script>
        function googleSignup() {
        window.location.href = "/oauth2/authorization/google";
    }
        function signupRequest() {
            const nickname = document.getElementById('nickname').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const agree = document.getElementById('agree').checked;

            if (!nickname || !email || !password) {
                alert("모든 항목을 입력해주세요.");
                return;
            }
            if (password !== confirmPassword) {
                alert("비밀번호가 일치하지 않습니다.");
                return;
            }
            if (!agree) {
                alert("약관에 동의해주세요.");
                return;
            }

            fetch('/auth/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nickname, email, password })
})
            .then(response => {
                if (response.ok) {
                    alert("회원가입 성공! 로그인해주세요.");
                    window.location.href = "/login";
                } else {
                    alert("회원가입 실패 (이미 존재하는 이메일일 수 있습니다).");
                }
            });
        }
    </script>
</body>
</html>
