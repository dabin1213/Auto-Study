spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:mysql://localhost:3306/autostudy?serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
# Hibernate 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 파일 업로드 크기 제한 해제
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# 구글 OAuth2 설정

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email


spring.mail.default-encoding=UTF-8

openrouter.api.key=${OPENROUTER_API_KEY}

#JWT ( 로그인 유지 ) = 이 키를 아는 사람은 로그인 토큰을 위조할 수 있음
jwt.secret=${JWT_SECRET}
jwt.access-seconds=3600
jwt.refresh-seconds=604800

# 업로드 용량을 넘겼을 때 연결을 끊지 않고 오류 메시지가 화면까지 가도록
server.tomcat.max-swallow-size=300MB

# DB가 꺼져 있을 때 30초 대신 5초 안에 실패 처리
spring.datasource.hikari.connection-timeout=5000